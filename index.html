<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>앱 수익 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --fg:#191F28; --sub:#4E5968; --muted:#8B95A1; --line:#E5E8EB; --total:#F9FAFB;
  --accent:#3182F6; --accent-soft:#E8F3FF; --plus:#F04452; --minus:#3182F6; --sat:#3182F6; --sun:#F04452; --chip:#F2F4F6;
  --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101013; --surface:#1C1C21; --fg:#F2F4F6; --sub:#B0B8C1; --muted:#7E8792; --line:#2C2C33; --total:#232329;
  --accent:#4D96FF; --accent-soft:#16263F; --plus:#FF5A67; --minus:#4D96FF; --sat:#4D96FF; --sun:#FF5A67; --chip:#26262C; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
.wrap{max-width:1760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;display:flex;flex-direction:column;gap:20px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:4px 4px 0}
header h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-0.03em}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.fx{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:999px}

.board{background:var(--surface);border-radius:24px;padding:8px 24px}
.app{padding-block:20px}
.app + .app{border-top:8px solid var(--bg);margin:0 -24px;padding-left:24px;padding-right:24px}
.app-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:12px;min-width:0;border:0;background:none;font:inherit;color:inherit;padding:0;cursor:pointer;text-align:left}
.toggle h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-0.02em}
.chev{font-size:16px;color:var(--muted);transition:transform .15s;display:inline-block}
.app.closed .chev{transform:rotate(-90deg)}
.icon{width:44px;height:44px;border-radius:12px;flex:none;object-fit:cover;background:var(--chip);border:1px solid var(--line)}
.icon.fb{display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--sub)}
.right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.net{font-size:13px;font-weight:600}
.net span{font-weight:500;color:var(--muted);margin-right:6px}
.up{color:var(--plus)} .down{color:var(--minus)} .zero{color:var(--sub)}
.body{margin-top:16px}
.app.closed .body{display:none}
th.memo-h,td.memo-cell{min-width:180px}
.memo-in{width:100%;min-width:0;text-align:center;height:32px;font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:8px;padding:0 8px}
.memo-in::placeholder{color:var(--muted);opacity:.6}
.memo-in:hover{background:var(--bg)}
.memo-in:focus{outline:none;background:var(--surface);border-color:var(--accent)}

.months{display:flex;gap:6px;flex-wrap:wrap;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:16px;width:fit-content;max-width:100%}
.month{border:0;font:inherit;font-size:14px;font-weight:600;padding:8px 16px;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.month:hover{color:var(--fg)}
.month[aria-pressed="true"]{background:var(--accent);color:#fff}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.table-scroll{overflow:auto;max-height:calc(41px + 15 * 45px + 52px);border:1px solid var(--line);border-radius:16px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:0;font-size:13px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:12px 6px;white-space:nowrap;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2;height:41px}
th:first-child,td:first-child{text-align:center;padding-left:12px;position:sticky;left:0;background:var(--surface);z-index:1}
th:first-child{z-index:3}
th:last-child,td:last-child{padding-right:16px}
th.ads{color:var(--accent)}
td{text-align:center;padding:0 6px;height:45px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--sub)}
td:first-child{color:var(--fg);font-weight:600}
td:first-child .wd{font-weight:600;margin-left:4px}
td:first-child .wd.sat{color:var(--sat)}
td:first-child .wd.sun{color:var(--sun)}
td.empty{color:var(--muted);opacity:.5}
td.profit{font-weight:700}
tbody tr:hover td{background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
tfoot td{background:var(--total);color:var(--fg);font-weight:700;border-bottom:0;border-top:1px solid var(--line);height:52px;position:sticky;bottom:0;z-index:2}
tfoot td:first-child{background:var(--total);z-index:3}
.none,.state{padding:48px 0;text-align:center;color:var(--muted);font-size:15px;line-height:1.6}
.state b{color:var(--minus)}
.foot{font-size:12px;color:var(--muted);padding:0 4px;line-height:1.6}

[hidden]{display:none!important}
.tabs{display:flex;gap:6px;background:var(--surface);padding:4px;border-radius:14px;width:fit-content}
.tabs button{border:0;font:inherit;font-size:14px;font-weight:700;padding:10px 20px;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
.sum{padding:20px 0;display:flex;flex-direction:column;gap:20px}
.sum-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;background:var(--chip);padding:4px;border-radius:12px}
.wchip{border:0;font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.wchip[aria-pressed="true"]{background:var(--accent);color:#fff}
.wnav{display:flex;align-items:center;gap:12px;font-size:18px}
.wnav button{border:0;background:var(--chip);color:var(--sub);width:36px;height:36px;border-radius:10px;font:inherit;cursor:pointer}
.wnav button:disabled{opacity:.35;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--bg);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi span{color:var(--muted);font-size:13px;font-weight:600}
.kpi b{font-size:22px;font-weight:800;letter-spacing:-0.02em}
.kpi em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted)}
.kpi em.up{color:var(--plus)} .kpi em.down{color:var(--minus)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:12px}
.chart{background:var(--bg);border-radius:16px;padding:16px 18px}
.chart h3{margin:0 0 8px;font-size:15px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.arow{display:grid;grid-template-columns:minmax(80px,240px) 1fr 130px;gap:12px;align-items:center;padding:6px 0}
.track{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:6px}
.arow b{text-align:right}
@media (max-width:760px){
  .board{padding:4px 20px;border-radius:20px}
  .app + .app{margin:0 -20px;padding-left:20px;padding-right:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" role="group" aria-label="보기 전환"><button data-view="dash" aria-pressed="true">대시보드</button><button data-view="sum" aria-pressed="false">주간 요약</button></div>
  <header>
    <div>
      <h1>앱 수익 대시보드</h1>
      <p id="updated">AdMob · Google Ads 매일 01:00 업데이트</p>
    </div>
    <span class="fx num" id="fx"></span>
  </header>

  <div class="board" id="board"><div class="state">시트에서 데이터를 불러오고 있어요…</div></div>
  <div class="board" id="summary" hidden></div>

  <p class="foot">순수익 = 예상 수입(USD) × 고정 환율 − ads 사용비용(KRW). 플러스는 빨간색, 마이너스는 파란색으로 표시돼요. 기록이 없는 날짜는 0으로 채워서 보여줘요. 합계 행의 eCPM·일치율·노출률·CTR·전환단가는 합계 기준으로 다시 계산한 값이에요.</p>
</div>

<script>
const FX = 1350; // 고정 환율 (원/달러)
const BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQeUYwQxCbX2dlzIxKY0vZUzVVkHkGvbwqeDWmjBFugSeGr9hiy9PWuM6wmfyeUgvxQPnON4g1QKTqB/pub";
const SHEETS = {
  info:  BASE + "?gid=1219947467&single=true&output=csv",
  admob: BASE + "?gid=935774785&single=true&output=csv",
  ads:   BASE + "?gid=1855278682&single=true&output=csv",
};

/* ===== 저장 (메모·접힘 상태) ===== */
const mem={};
const store={
  get(k){ try{ const v=localStorage.getItem(k); if(v!==null) return v; }catch(e){} return mem[k]??null; },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ===== CSV 파싱 ===== */
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()!==""));
}
const norm=s=>String(s||"").replace(/\s+/g,"").toLowerCase();
function col(header, ...keys){
  const h=header.map(norm);
  for(const k of keys){ const i=h.findIndex(x=>x===norm(k)); if(i>=0) return i; }
  for(const k of keys){ const i=h.findIndex(x=>x.includes(norm(k))); if(i>=0) return i; }
  return -1;
}
const num=v=>{ if(v==null) return 0; const s=String(v).replace(/[₩$,%\s원]/g,"").replace(/−/g,"-"); const n=parseFloat(s); return isFinite(n)?n:0; };
function toDate(v){
  const m=String(v||"").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  const m2=String(v||"").match(/^(\d{4})(\d{2})(\d{2})$/);
  return m2?`${m2[1]}-${m2[2]}-${m2[3]}`:null;
}
function findDateCol(header, rows){
  let i=col(header,"일","날짜","일자","date","day");
  if(i>=0) return i;
  return header.findIndex((_,j)=>rows.slice(0,5).some(r=>toDate(r[j])));
}

/* ===== 데이터 합치기 ===== */
function buildData(infoRows, admobRows, adsRows){
  const apps=[], icons={};
  if(infoRows.length>1){
    const h=infoRows[0];
    let ni=col(h,"앱 이름","앱이름","앱","app name","app","name");
    let ii=col(h,"아이콘","icon","이미지","image","url");
    infoRows.slice(1).forEach(r=>{
      if(ii<0) ii=r.findIndex(v=>/^https?:\/\//.test(v.trim()));
      if(ni<0) ni=r.findIndex((v,j)=>j!==ii&&v.trim());
      const name=(r[ni]||"").trim(); if(!name) return;
      if(!apps.includes(name)) apps.push(name);
      if(ii>=0&&r[ii]) icons[name]=r[ii].trim();
    });
  }
  const byApp={};
  const cell=(app,date)=>{ byApp[app]??={}; return byApp[app][date]??={rev:0,req:0,matched:0,imp:0,clicks:0,conv:0,cost:0,hasAds:false}; };

  if(admobRows.length>1){
    const h=admobRows[0], body=admobRows.slice(1);
    const c={date:findDateCol(h,body), app:col(h,"앱","app"), rev:col(h,"예상 수입","수입","earnings","revenue"),
      req:col(h,"요청수","광고 요청","requests"), matched:col(h,"일치 요청","matched requests"), imp:col(h,"노출수","impressions"), clicks:col(h,"클릭수","clicks")};
    body.forEach(r=>{
      const d=toDate(r[c.date]), app=(r[c.app]||"").trim(); if(!d||!app) return;
      if(!apps.includes(app)) apps.push(app);
      const x=cell(app,d);
      x.rev+=num(r[c.rev]); x.req+=num(r[c.req]); x.matched+=num(r[c.matched]); x.imp+=num(r[c.imp]); x.clicks+=num(r[c.clicks]);
    });
  }
  const keyOf=s=>String(s||"").replace(/^\s*app\s*\)\s*/i,"").trim();
  const matchApp=raw=>{
    const k=norm(keyOf(raw)); if(!k) return null;
    const hits=apps.filter(a=>{const n=norm(a); return n===k||n.includes(k)||k.includes(n);});
    return hits.sort((a,b)=>b.length-a.length)[0]||null;
  };
  if(adsRows.length>1){
    const h=adsRows[0], body=adsRows.slice(1);
    const c={date:findDateCol(h,body), app:col(h,"앱","app","캠페인","campaign"),
      conv:col(h,"전환수","전환","conversions"), cost:col(h,"비용(krw)","비용","cost")};
    if(c.cost>=0 && norm(h[c.cost]).includes("전환당")) c.cost=h.findIndex((x,j)=>norm(x).includes("비용")&&!norm(x).includes("전환당"));
    body.forEach(r=>{
      const d=toDate(r[c.date]); if(!d) return;
      const app=matchApp(r[c.app]);
      if(!app) return;
      const x=cell(app,d); x.conv+=num(r[c.conv]); x.cost+=num(r[c.cost]); x.hasAds=true;
    });
  }
  const data={};
  apps.forEach(a=>{ data[a]=Object.entries(byApp[a]||{}).map(([date,x])=>({date,...x})).sort((p,q)=>p.date.localeCompare(q.date)); });
  return {apps:apps.filter(a=>data[a].length||icons[a]), icons, data};
}

/* ===== 화면 ===== */
const $=id=>document.getElementById(id);
const won=n=>(Math.round(n)<0?"−₩":"₩")+Math.abs(Math.round(n)).toLocaleString("ko-KR");
const usd=n=>n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(a,b)=>b?(a/b*100).toFixed(2)+"%":"0.00%";
const int=n=>Math.round(n).toLocaleString("ko-KR");
const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
const cls=v=>Math.round(v)>0?"up":Math.round(v)<0?"down":"zero";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAYS=["일","월","화","수","목","금","토"];

function dateLabel(d){
  const [y,m,dd]=d.split("-").map(Number), w=new Date(y,m-1,dd).getDay();
  return `${d}<span class="wd ${w===6?"sat":w===0?"sun":""}">(${DAYS[w]})</span>`;
}
const HEAD=`<thead><tr><th>일</th><th>예상 수입(USD)</th><th>eCPM(USD)</th><th>요청수</th><th>일치율</th><th>일치 요청</th><th>노출률</th><th>노출수</th><th>클릭률(CTR)</th><th>클릭수</th><th class="ads">ads 전환수</th><th class="ads">ads 전환단가</th><th class="ads">ads 사용비용</th><th>순수익</th><th class="memo-h">메모</th></tr></thead>`;
function row(label,x,showAds,memo=""){
  const v=x.rev*FX-x.cost, ecpm=x.imp?x.rev/x.imp*1000:0;
  return `<tr><td>${label}</td><td>${usd(x.rev)}</td><td>${usd(ecpm)}</td><td>${int(x.req)}</td><td>${pct(x.matched,x.req)}</td><td>${int(x.matched)}</td><td>${pct(x.imp,x.matched)}</td><td>${int(x.imp)}</td><td>${pct(x.clicks,x.imp)}</td><td>${int(x.clicks)}</td>`
   + (showAds?`<td>${int(x.conv)}</td><td>${won(x.conv?x.cost/x.conv:0)}</td><td>${won(x.cost)}</td>`:`<td class="empty">—</td><td class="empty">—</td><td class="empty">—</td>`)
   + `<td class="profit ${cls(v)}">${won(v)}</td><td class="memo-cell">${memo}</td></tr>`;
}
const monthKey=d=>d.slice(0,7);
const monthLabel=k=>`${+k.slice(5)}월`;
const zero=date=>({date,rev:0,req:0,matched:0,imp:0,clicks:0,conv:0,cost:0,hasAds:false});

// 해당 월의 1일 ~ 마지막 데이터 날짜까지 빈 날짜를 0으로 채움
function fillMonth(rows, month, lastDay){
  const map=Object.fromEntries(rows.map(x=>[x.date,x]));
  const out=[];
  for(let d=1; d<=lastDay; d++){
    const date=`${month}-${String(d).padStart(2,"0")}`;
    out.push(map[date]||zero(date));
  }
  return out;
}

let DB, sel={}, closed={};
const memoKey=(app,date)=>`memo|${app}|${date}`;
const memoCell=(ai,app,date)=>`<input class="memo-in" data-a="${ai}" data-d="${date}" value="${esc(store.get(memoKey(app,date))||"")}" aria-label="${date} 메모">`;

function iconHtml(app){
  const u=DB.icons[app], fb=`<div class="icon fb">${esc(app[0]||"?")}</div>`;
  return u?`<img class="icon" src="${esc(u)}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML=this.dataset.fb" data-fb="${esc(fb)}">`:fb;
}
function render(){
  const allMonths=[...new Set(DB.apps.flatMap(a=>DB.data[a].map(x=>monthKey(x.date))))].sort();
  const multiYear=new Set(allMonths.map(k=>k.slice(0,4))).size>1;
  const label=k=>multiYear?`${k.slice(2,4)}년 ${monthLabel(k)}`:monthLabel(k);
  const lastDay={};
  DB.apps.forEach(a=>DB.data[a].forEach(x=>{ const m=monthKey(x.date), d=+x.date.slice(8); if(!lastDay[m]||d>lastDay[m]) lastDay[m]=d; }));

  $("board").innerHTML=DB.apps.map((app,ai)=>{
    const own=[...new Set(DB.data[app].map(x=>monthKey(x.date)))];
    const month=sel[app] ?? (own.length?own[own.length-1]:allMonths[allMonths.length-1]);
    sel[app]=month;
    if(closed[app]===undefined) closed[app]=store.get("closed|"+app)==="1";
    const isClosed=closed[app];
    const real=DB.data[app].filter(x=>monthKey(x.date)===month);
    const rows=real.length?fillMonth(real,month,lastDay[month]):[];
    const showAds=rows.some(x=>x.hasAds);
    const t={rev:sum(rows,"rev"),req:sum(rows,"req"),matched:sum(rows,"matched"),imp:sum(rows,"imp"),clicks:sum(rows,"clicks"),conv:sum(rows,"conv"),cost:sum(rows,"cost")};
    const n=t.rev*FX-t.cost;

    const btns=allMonths.length?`<div class="months" role="group" aria-label="${esc(app)} 월 선택">${allMonths.map(m=>`<button class="month" data-app="${ai}" data-m="${m}" aria-pressed="${m===month}">${label(m)}</button>`).join("")}</div>`:"";
    
    const netHtml=rows.length?`<div class="net num"><span>${label(month)} 순수익</span><b class="${cls(n)}">${won(n)}</b></div>`:"";
    const content=rows.length
      ? `<div class="table-scroll"><table class="num">${HEAD}<tbody>${rows.map(x=>row(dateLabel(x.date),x,showAds,memoCell(ai,app,x.date))).join("")}</tbody><tfoot>${row("합계",t,showAds)}</tfoot></table></div>`
      : `<div class="none">${month?label(month):""} 데이터가 아직 없어요</div>`;

    return `<section class="app${isClosed?" closed":""}">
      <div class="app-head">
        <button class="toggle" data-toggle="${ai}" aria-expanded="${!isClosed}" aria-label="${esc(app)} 접기/펼치기">${iconHtml(app)}<h2>${esc(app)}</h2><span class="chev">▾</span></button>
        <div class="right">${netHtml}</div>
      </div>
      <div class="body">${btns}${content}</div>
    </section>`;
  }).join("") || `<div class="state">표시할 앱 데이터가 없어요.</div>`;

  const B=document.querySelectorAll.bind(document);
  B(".month").forEach(b=>b.onclick=()=>{sel[DB.apps[+b.dataset.app]]=b.dataset.m;render()});
  B("[data-toggle]").forEach(b=>b.onclick=()=>{const a=DB.apps[+b.dataset.toggle]; closed[a]=!closed[a]; store.set("closed|"+a,closed[a]?"1":"0"); render()});
  B(".memo-in").forEach(t=>t.oninput=()=>store.set(memoKey(DB.apps[+t.dataset.a],t.dataset.d),t.value));
}

/* ===== 주간 요약 (월~일) ===== */
let VIEW="dash", wk=null, wApp="all";
const dstr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parts=s=>s.split("-").map(Number);
const addDays=(s,n)=>{const [y,m,d]=parts(s);return dstr(new Date(y,m-1,d+n))};
const mondayOf=s=>{const [y,m,d]=parts(s);const t=new Date(y,m-1,d);return dstr(new Date(y,m-1,d-((t.getDay()+6)%7)))};
const short=n=>{const a=Math.abs(n),s=n<0?"−":"";return a>=10000?s+(a/10000).toFixed(1)+"만":s+int(a)};
function weekAgg(start,app){
  const apps=app==="all"?DB.apps:[app];
  return Array.from({length:7},(_,i)=>{
    const date=addDays(start,i), x=zero(date);
    apps.forEach(a=>{const r=DB.data[a].find(r=>r.date===date); if(r) ["rev","req","matched","imp","clicks","conv","cost"].forEach(k=>x[k]+=r[k]);});
    x.krw=x.rev*FX; x.profit=x.krw-x.cost; return x;
  });
}
function bars(days,series,fmt){
  const W=720,H=260,L=8,R=8,T=28,Bm=34,ph=H-T-Bm,n=days.length,gw=(W-L-R)/n;
  const vals=days.flatMap(d=>series.map(s=>d[s.key]));
  const mx=Math.max(0,...vals), mn=Math.min(0,...vals), rng=(mx-mn)||1;
  const y=v=>T+(mx-v)/rng*ph, y0=y(0), bw=Math.min(40,gw*0.75/series.length);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><line x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}" stroke="var(--line)"/>`;
  days.forEach((d,i)=>{
    const [yy,mm,dd]=parts(d.date), w=new Date(yy,mm-1,dd).getDay(), cx=L+gw*i+gw/2;
    series.forEach((se,j)=>{
      const v=d[se.key], bx=cx-bw*series.length/2+bw*j, py=y(v), h=Math.abs(py-y0);
      const fill=se.color||(v>=0?"var(--plus)":"var(--minus)");
      s+=`<rect x="${bx+1}" y="${Math.min(py,y0)}" width="${bw-2}" height="${v?Math.max(h,1):0}" rx="4" fill="${fill}"/>`;
      if(series.length===1) s+=`<text x="${bx+bw/2}" y="${v>=0?py-6:py+14}" text-anchor="middle" font-size="11" fill="var(--sub)">${fmt(v)}</text>`;
    });
    s+=`<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="12" font-weight="600" fill="${w===6?"var(--sat)":w===0?"var(--sun)":"var(--fg)"}">${DAYS[w]} ${dd}</text>`;
  });
  return s+"</svg>";
}
function renderSummary(){
  const all=DB.apps.flatMap(a=>DB.data[a].map(x=>x.date)).sort();
  if(!all.length){$("summary").innerHTML='<div class="state">데이터가 없어요.</div>';return;}
  const first=mondayOf(all[0]), lastW=mondayOf(all[all.length-1]);
  if(!wk||wk>lastW) wk=lastW; if(wk<first) wk=first;
  const days=weekAgg(wk,wApp), prev=weekAgg(addDays(wk,-7),wApp);
  const T=a=>({krw:sum(a,"krw"),cost:sum(a,"cost"),profit:sum(a,"profit"),imp:sum(a,"imp"),clicks:sum(a,"clicks")});
  const t=T(days), p=T(prev);
  const card=(l,txt,k,tone,neutral)=>{
    const dl=p[k]?((t[k]-p[k])/Math.abs(p[k])*100):null;
    return `<div class="kpi"><span>${l}</span><b class="${tone}">${txt}</b><em class="${dl==null||neutral?"":cls(dl)}">${dl==null?"지난주 데이터 없음":"지난주 대비 "+(dl>0?"+":"")+dl.toFixed(1)+"%"}</em></div>`;
  };
  const fmtD=s=>s.slice(5).replace("-","/");
  const chips=["전체",...DB.apps].map((a,i)=>{const nm=a.length>12?a.slice(0,12)+"…":a; const on=i===0?wApp==="all":DB.apps[i-1]===wApp; return `<button class="wchip" data-wi="${i-1}" aria-pressed="${on}">${esc(nm)}</button>`}).join("");
  let list="";
  if(wApp==="all"){
    const rs=DB.apps.map(a=>({a,p:T(weekAgg(wk,a)).profit})), mx=Math.max(1,...rs.map(r=>Math.abs(r.p)));
    list=`<div class="chart"><h3>앱별 주간 순수익</h3>${rs.map(r=>`<div class="arow"><span>${esc(r.a)}</span><div class="track"><i style="width:${Math.abs(r.p)/mx*100}%;background:${r.p>=0?"var(--plus)":"var(--minus)"}"></i></div><b class="num ${cls(r.p)}">${won(r.p)}</b></div>`).join("")}</div>`;
  }
  $("summary").innerHTML=`<div class="sum">
    <div class="sum-top"><div class="wnav"><button data-w="-1" aria-label="이전 주" ${wk<=first?"disabled":""}>◀</button><b class="num">${fmtD(wk)} ~ ${fmtD(addDays(wk,6))} (월~일)</b><button data-w="1" aria-label="다음 주" ${wk>=lastW?"disabled":""}>▶</button></div><div class="chips">${chips}</div></div>
    <div class="kpis num">${card("주간 순수익",won(t.profit),"profit",cls(t.profit))}${card("수입(원화 환산)",won(t.krw),"krw","")}${card("ads 사용비용",won(t.cost),"cost","",true)}${card("노출수",int(t.imp),"imp","")}</div>
    <div class="charts">
      <div class="chart"><h3>일별 순수익</h3>${bars(days,[{key:"profit"}],short)}</div>
      <div class="chart"><h3>일별 수입 vs ads 비용</h3><div class="legend"><span><i style="background:var(--accent)"></i>수입</span><span><i style="background:var(--muted)"></i>ads 비용</span></div>${bars(days,[{key:"krw",color:"var(--accent)"},{key:"cost",color:"var(--muted)"}],short)}</div>
    </div>${list}</div>`;
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{wk=addDays(wk,7*+b.dataset.w);renderSummary()});
  document.querySelectorAll("[data-wi]").forEach(b=>b.onclick=()=>{wApp=+b.dataset.wi<0?"all":DB.apps[+b.dataset.wi];renderSummary()});
}
function show(){
  $("board").hidden=VIEW!=="dash"; $("summary").hidden=VIEW!=="sum";
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===VIEW));
  if(VIEW==="sum"&&DB) renderSummary();
}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{VIEW=b.dataset.view;show()});

async function load(){
  $("fx").textContent=`환율 1달러 = ${FX.toLocaleString("ko-KR")}원`;
  try{
    const get=u=>fetch(u+"&t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok) throw new Error(r.status); return r.text()}).then(parseCSV);
    const [info,admob,ads]=await Promise.all([get(SHEETS.info).catch(()=>[]),get(SHEETS.admob),get(SHEETS.ads).catch(()=>[])]);
    DB=buildData(info,admob,ads);
    const last=DB.apps.flatMap(a=>DB.data[a].map(x=>x.date)).sort().pop();
    if(last) $("updated").textContent=`마지막 데이터 ${last} · 매일 01:00 업데이트`;
    render(); show();
  }catch(e){
    $("board").innerHTML=`<div class="state"><b>시트를 불러오지 못했어요.</b><br>구글 시트의 '웹에 게시'가 켜져 있는지 확인하고 새로고침해 주세요.</div>`;
  }
}
load();
</script>
